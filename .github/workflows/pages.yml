name: Test and deploy to GitHub Pages
# Every push and pull request: unit tests (Vitest), browser tests (Playwright, desktop + phone), and the leaderboard
# API tests (worker/, on a local D1). Pushes to main deploy to GitHub Pages only when the game's tests pass, and deploy
# the leaderboard API to Cloudflare Workers when the repository has the CLOUDFLARE_API_TOKEN secret (CLOUDFLARE_ACCOUNT_ID
# is optional: wrangler finds the account when the token covers only one; without a token the job only prints a notice).
# Node.js 24 (LTS); the runner is pinned to Ubuntu 24.04 so Playwright's browser dependencies install cleanly.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Single-file builds (for the file:// tests)
        run: npm run build:all
      - name: Browser tests
        run: npm run e2e
      - name: Keep the test report when something fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
  worker-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - name: API tests (wrangler dev + local D1)
        run: npm test
  worker-deploy:
    needs: [test, worker-test]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      STATS_KEY: ${{ secrets.STATS_KEY }}
      RANKED_POOL_KEY: ${{ secrets.RANKED_POOL_KEY }}
      API_URL: https://financial-duel-api.maxwei6699.workers.dev
    defaults:
      run:
        working-directory: worker
    steps:
      - name: Cloudflare secrets missing
        if: env.CLOUDFLARE_API_TOKEN == ''
        working-directory: ${{ github.workspace }}        # nothing is checked out in this case
        run: echo "::notice title=排行榜 API 未部署::請在 repo 的 Settings → Secrets and variables → Actions 加入 CLOUDFLARE_API_TOKEN（見 worker/README.md）"
      - uses: actions/checkout@v7
        if: env.CLOUDFLARE_API_TOKEN != ''
      - uses: actions/setup-node@v7
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - name: Deploy the leaderboard API
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          npm ci
          find_db() { npx wrangler d1 list --json 2>/dev/null | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const l=JSON.parse(s.slice(s.indexOf('[')));const d=l.find(x=>x.name==='financial-duel');process.stdout.write(d?d.uuid:'')})"; }
          id=$(find_db)
          if [ -z "$id" ]; then npx wrangler d1 create financial-duel; id=$(find_db); fi
          test -n "$id"
          sed -i "s/00000000-0000-0000-0000-000000000000/$id/" wrangler.toml
          npx wrangler d1 migrations apply financial-duel --remote
          # the private ranked question bank: decrypted with the RANKED_POOL_KEY secret (without it: calculation + public questions)
          node tools/pool.mjs build
          if [ -z "$RANKED_POOL_KEY" ]; then echo "::notice title=排位不公開題庫未啟用::加入 GitHub secret RANKED_POOL_KEY 後重新部署（見 worker/README.md）。目前排位賽用計算題與公開題庫出題"; fi
          npx wrangler deploy
          # the password of the /v1/stats page (optional GitHub secret STATS_KEY)
          if [ -n "$STATS_KEY" ]; then printf '%s' "$STATS_KEY" | npx wrangler secret put STATS_KEY; else echo "::notice title=每日統計頁未設密碼::加入 GitHub secret STATS_KEY 後重新部署，就能用 /v1/stats?key=… 查看每日玩家數"; fi
      - name: Check the deployed API
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          ok=0; for i in 1 2 3 4 5 6; do curl -fsS "$API_URL/v1/health" && { ok=1; break; }; sleep 10; done; test $ok = 1
          pool=$(curl -fsS "$API_URL/v1/health" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(String(JSON.parse(s).rankedPool)))")
          echo; echo "::notice title=排位題庫::伺服器出題已上線；不公開題 $pool 題（0 = 還沒有 RANKED_POOL_KEY，改用公開題庫與計算題）"
          # write path against the real D1: join with a throwaway nickname, read it back, delete it
          name="部署檢查$(date +%s | tail -c 5)"
          reg=$(curl -fsS -X POST "$API_URL/v1/register" -H 'Content-Type: application/json' -d "{\"name\":\"$name\"}")
          auth=$(echo "$reg" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const r=JSON.parse(s);process.stdout.write(r.id+'.'+r.token)})")
          curl -fsS "$API_URL/v1/me" -H "Authorization: Bearer $auth" | grep -q "$name"
          # a ranked question asked by the server, answered as a time-out (deleting the player removes it all)
          ticket=$(curl -fsS -X POST "$API_URL/v1/match/start" -H "Authorization: Bearer $auth" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).ticket))")
          curl -fsS -X POST "$API_URL/v1/match/q" -H "Authorization: Bearer $auth" -H 'Content-Type: application/json' -d "{\"ticket\":\"$ticket\",\"cat\":\"risk\",\"rank\":2,\"limit\":20}" | grep -q '"options"'
          curl -fsS -X POST "$API_URL/v1/match/a" -H "Authorization: Bearer $auth" -H 'Content-Type: application/json' -d "{\"ticket\":\"$ticket\",\"n\":1,\"pick\":-1}" | grep -q '"correct":false'
          curl -fsS -X DELETE "$API_URL/v1/me" -H "Authorization: Bearer $auth"
          # the statistics route answers (an empty ping is refused without counting anything)
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST "$API_URL/v1/ping" -H 'Content-Type: application/json' -d '{}')" = 400
          echo; echo "API OK: register / me / ranked question / delete / ping"
  build:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
