# 金融卡牌小遊戲線上排行榜 API — Cloudflare Workers + D1
# Deployed by .github/workflows/pages.yml (job "worker") when the repository has the CLOUDFLARE_API_TOKEN and
# CLOUDFLARE_ACCOUNT_ID secrets. The job creates the D1 database on first deploy and fills in database_id below.
name = "financial-duel-api"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "financial-duel"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[vars]
# a ranked duel shorter than this cannot be submitted (a real duel takes several minutes)
MIN_MATCH_MS = "45000"

[observability]
enabled = true
